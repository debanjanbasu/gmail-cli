[package]
name = "grr-calendar"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Google Calendar API client for the grr suite: typed endpoints over the shared HTTP/3 core"
categories = ["api-bindings", "date-time", "network-programming"]
keywords = ["calendar", "api", "http3", "google"]

[dependencies]
# No direct reqwest here: HttpCore owns the transport and every request
# goes through grr-core's builder (bearer, retry, rate valve).
grr-core = { path = "../grr-core", version = "0.3.0", features = ["http3"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# Calendar IDs are path segments ("primary" or an email address) and must
# be percent-encoded before joining into the base URL.
urlencoding = { workspace = true }

[features]
# Forward: the CLI enables HTTP/3 everywhere; library users may stay stable.
http3 = ["grr-core/http3"]

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }

# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
