[package]
name = "gmail-skill-bindings"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "NAPI bindings for gmail-cli skill integration"
categories = ["development-tools::ffi"]

[lib]
crate-type = ["cdylib"]

[dependencies]
gmail-core = { path = "../gmail-core" }
napi = { workspace = true, features = ["napi8", "tokio_rt"] }
napi-derive = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
