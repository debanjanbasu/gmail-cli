[package]
name = "grr-chat"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Google Chat API client for the grr suite: typed endpoints over the shared HTTP/3 core"
categories = ["api-bindings", "web-programming", "network-programming"]
keywords = ["chat", "api", "http3", "google"]

[dependencies]
# No direct reqwest here: HttpCore owns the transport and every request
# goes through grr-core's builder (bearer, retry, rate valve).
grr-core = { path = "../grr-core", version = "0.3.0", features = ["http3"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# Space IDs are path segments ("spaces/AAA" or a bare "AAA") and the
# trailing segment must be percent-encoded before joining into the
# base URL.
urlencoding = { workspace = true }

[features]
# HTTP/3 by default: the runtime auto-falls-back to HTTP/2 over TCP.
# Requires nightly + RUSTFLAGS="--cfg reqwest_unstable" (see grr-core).
default = ["http3"]
http3 = ["grr-core/http3"]

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }

# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
