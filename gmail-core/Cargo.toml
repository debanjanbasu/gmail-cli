[package]
name = "gmail-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "High-performance Gmail API core library with HTTP/3 and parallel batch operations"
categories = ["api-bindings", "email", "network-programming"]
keywords = ["gmail", "api", "http3", "streaming"]

[dependencies]
# Workspace dependencies - all required
reqwest = { workspace = true, features = ["http3", "zstd", "brotli", "gzip", "deflate", "rustls", "json", "form", "query"] }
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
dirs = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Additional dependencies
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
urlencoding = { workspace = true }
open = "5.4"
num_cpus = "1.17"

# Platform-specific: io_uring only on Linux, only behind the feature gate
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { workspace = true, optional = true }
io-uring = { workspace = true, optional = true }

[dev-dependencies]
mockito = { workspace = true }
wiremock = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }

[features]
# Only optional features that control optional dependencies
default = ["http3", "zstd", "brotli"]
http3 = []
zstd = []
brotli = []
io_uring = ["dep:tokio-uring", "dep:io-uring"]
# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
