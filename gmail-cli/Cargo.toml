[package]
name = "gmail-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "High-performance Gmail CLI with verified HTTP/3 transport and streaming I/O"
categories = ["command-line-utilities", "email"]

[dependencies]
gmail-core = { path = "../gmail-core" }
clap = { workspace = true, features = ["derive", "env", "help", "usage", "cargo", "color", "unicode", "wrap_help"] }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
comfy-table = "8.0"
mime_guess = "2.0"
base64 = { workspace = true, features = ["alloc", "std"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "gmail"
path = "src/main.rs"
