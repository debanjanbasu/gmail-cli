name: Publish to crates.io

# Trusted Publishing (OIDC): no long-lived API tokens stored anywhere.
# One-time per-crate trust config on crates.io (Settings -> Trusted
# Publishing): owner debanjanbasu, repo grr-cli, workflow publish.yml,
# environment crates-io. Initial 0.3.0s were published with a since-revoked
# short-lived token; from now on this workflow is the only publisher.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order matters: each crate resolves the previous ones from
      # the registry during packaging.
      - name: Publish grr-core
        run: cargo publish -p grr-core --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish service crates
        run: |
          for c in grr-gmail grr-calendar grr-drive grr-people grr-chat grr-forms; do
            echo "publishing $c"
            cargo publish -p "$c" --no-verify
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish grr-cli (the binary)
        run: cargo publish -p grr-cli --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}