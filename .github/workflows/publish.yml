name: Publish to crates.io

# Trusted Publishing (OIDC): no long-lived API tokens stored anywhere.
# One-time trust config on crates.io (Settings -> Trusted Publishing):
# owner debanjanbasu, repo grr-cli, workflow publish.yml, environment
# crates-io. The initial 0.3.0s were published with a since-revoked
# short-lived token; from now on this workflow is the only publisher.
#
# The project is ONE crate: `grr-cli` (binary `grr`, library `grr_cli`).
# The 0.3.0 library crates (grr-core, grr-gmail, grr-calendar, grr-drive,
# grr-people, grr-chat, grr-forms) are legacy and receive no new versions.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish grr-cli (the only published crate)
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}