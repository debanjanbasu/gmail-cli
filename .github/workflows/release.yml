name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-windows
            os: windows-latest
            artifact: gmail.exe
            archive: gmail-x86_64-windows.zip
          - name: x86_64-linux
            os: ubuntu-latest
            artifact: gmail
            archive: gmail-x86_64-linux.tar.gz
          - name: aarch64-macos
            os: macos-latest
            artifact: gmail
            archive: gmail-aarch64-macos.tar.gz
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gmail-cli

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: tar czf "${{ matrix.target.archive }}" -C target/release "${{ matrix.target.artifact }}"

      - name: Archive (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/gmail.exe -DestinationPath ${{ matrix.target.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.archive }}
          path: ${{ matrix.target.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gmail-x86_64-windows.zip
            gmail-x86_64-linux.tar.gz
            gmail-aarch64-macos.tar.gz
