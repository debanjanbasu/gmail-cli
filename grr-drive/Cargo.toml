[package]
name = "grr-drive"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Google Drive API client for the grr suite: typed endpoints over the shared HTTP/3 core"
categories = ["api-bindings", "filesystem", "network-programming"]
keywords = ["drive", "api", "http3", "google"]

[dependencies]
grr-core = { path = "../grr-core", version = "0.3.0", features = ["http3"] }
# Streaming media downloads need reqwest directly (bytes_stream, headers).
# Mirrors grr-core's standalone declaration; default features stay off.
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2", "rustls", "json", "stream", "gzip", "deflate", "zstd", "brotli",
] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
# File IDs are path segments and may contain '/' or other reserved
# characters; percent-encode before joining into the base URL.
urlencoding = { workspace = true }
# Random multipart/related boundaries for files.create uploads.
rand = { workspace = true }
# Media part Content-Type detection for multipart uploads.
mime_guess = "2.0"
# Iterating a streaming media download (bytes_stream) needs StreamExt.
futures = { workspace = true }

[features]
# HTTP/3 by default: the runtime auto-falls-back to HTTP/2 over TCP.
# Requires nightly + RUSTFLAGS="--cfg reqwest_unstable" (see grr-core).
default = ["http3"]
http3 = ["grr-core/http3", "reqwest/http3"]

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }

# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
