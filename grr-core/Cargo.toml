[package]
name = "grr-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "High-performance Gmail API core library with HTTP/3 and parallel batch operations"
categories = ["api-bindings", "email", "network-programming"]
keywords = ["gmail", "api", "http3", "streaming"]

[dependencies]
# Standalone declaration on purpose: default features stay off so this crate
# builds on stable toolchains (crates.io consumers); the `http3` feature
# (enabled by the grr CLI) turns on reqwest's unstable HTTP/3 support and
# requires nightly + `--cfg reqwest_unstable`.
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2", "rustls", "json", "form", "query", "stream", "gzip", "deflate", "zstd", "brotli",
] }
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
dirs = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Additional dependencies
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
urlencoding = { workspace = true }
open = "5.4"
num_cpus = "1.17"
keyring = { version = "4.2.0", features = ["windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }

# Platform-specific: io_uring only on Linux, only behind the feature gate
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { workspace = true, optional = true }
io-uring = { workspace = true, optional = true }

[dev-dependencies]
mockito = { workspace = true }
wiremock = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }

[features]
# Defaults are empty: stable toolchain, publishable to crates.io as-is.
default = []
# Unstable HTTP/3 via QUIC. Requires nightly + the reqwest_unstable cfg
# (the repo's .cargo/config.toml sets it); the CLI always enables this.
http3 = ["reqwest/http3"]
# Linux io_uring file I/O acceleration (auto-detected at runtime).
io_uring = ["dep:tokio-uring", "dep:io-uring"]
# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]

