[package]
name = "grr-gmail"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Gmail API client for the grr suite: typed endpoints over the shared HTTP/3 core"
categories = ["api-bindings", "email", "network-programming"]
keywords = ["gmail", "api", "http3", "google"]

[dependencies]
grr-core = { path = "../grr-core", version = "0.3.0", features = ["http3"] }
# Streaming uploads need reqwest directly (Body::wrap_stream, headers).
# Mirrors grr-core's standalone declaration; default features stay off.
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2", "rustls", "json", "stream", "gzip", "deflate", "zstd", "brotli",
] }
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[features]
# Forward: the CLI enables HTTP/3 everywhere; library users may stay stable.
http3 = ["grr-core/http3", "reqwest/http3"]

[dev-dependencies]
mockito = { workspace = true }
wiremock = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }

# Intentionally not inheriting [workspace.lints] (pedantic/nursery deny).
[lints]
