[workspace]
resolver = "2"
members = [
    "gmail-core",
    "gmail-cli",
    "gmail-skill-bindings",
]
exclude = ["target/**", ".cargo/**", "*.md"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Debanjan Basu <debanjanbasu2006@gmail.com>"]
repository = "https://github.com/debanjanbasu/gmail-opencode-rust"
description = "High-performance Gmail API client with HTTP/3, io_uring, and zero-copy streaming"
keywords = ["gmail", "api", "http3", "io-uring", "zero-copy", "napi"]
categories = ["api-bindings", "email", "network-programming"]

[workspace.dependencies]
# ── HTTP/3 + Compression Stack ─────────────────────────────────────────────
reqwest = { version = "0.13.4", features = [
    "http3",           # UNSTABLE: HTTP/3 support via quinn
    "zstd",            # zstd decompression
    "brotli",          # brotli decompression
    "stream",          # futures::Stream support
    "hickory-dns",     # async DNS over HTTPS/TLS
    "rustls",          # rustls TLS backend
    "json", "multipart", "cookies", "form", "query"
] }
quinn = { version = "0.11.11", features = ["rustls-aws-lc-rs", "runtime-tokio"] }
h3 = { version = "0.0.8" }
# h3-quinn is integrated into h3 0.0.8+
hickory-dns = { version = "0.26.1", features = ["tokio", "dns-over-https", "dns-over-tls", "dns-over-quic"] }

# ── Async Runtime ──────────────────────────────────────────────────────────
tokio = { version = "1.53.1", features = [
    "full", "rt-multi-thread", "macros", "signal", "io-std", "net", "time", "fs", "sync", "parking_lot"
] }
tokio-uring = { version = "0.5.0" }
tokio-rustls = { version = "0.26.0" }
tokio-util = { version = "0.7.11", features = ["full", "io", "codec", "time", "compat"] }

# ── Zero-Copy Serialization ────────────────────────────────────────────────
rkyv = { version = "0.8.18", features = ["bytecheck", "alloc", "std"] }
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = "1.0.134"
simd-json = { version = "0.17.3", features = ["serde"] }

# ── Auth ───────────────────────────────────────────────────────────────────
oauth2 = { version = "5.0.0", features = ["pkce-plain", "reqwest"] }
url = "2.5.4"
ring = "0.17.8"
rustls = { version = "0.23.43", features = ["std", "logging", "aws-lc-rs"] }
webpki-roots = "0.26.2"

# ── Config & CLI ───────────────────────────────────────────────────────────
clap = { version = "4.5.26", features = ["derive", "env", "wrap_help", "string"] }
config = { version = "0.14.1", features = ["toml"] }
dirs = "5.0.1"
toml = "0.8.19"
figment = { version = "0.10.19", features = ["env", "toml"] }

# ── Observability ──────────────────────────────────────────────────────────
tracing = { version = "0.1.41", features = ["std", "log", "attributes", "valuable"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "fmt"] }
metrics = { version = "0.22.4" }
metrics-exporter-prometheus = "0.18.3"
valuable = "0.1.0"

# ── Performance ────────────────────────────────────────────────────────────
bytes = { version = "1.10.1", features = ["extra-platforms"] }
futures = "0.3.31"
smallvec = "1.13.3"
ahash = "0.8.11"
parking_lot = { version = "0.12.3", features = ["nightly", "hardware-lock-elision"] }
dashmap = "6.1.3"
flume = "0.11.0"

# ── Build & Compression ────────────────────────────────────────────────────
zstd = { version = "0.13.3", features = ["fat-lto", "zdict_builder", "zstdmt"] }
brotli = { version = "8.0.4", features = ["std"] }

# ── Web Framework (OAuth Server) ───────────────────────────────────────────
axum = { version = "0.8.9", features = ["ws", "json", "multipart", "form"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util", "retry"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-full", "limit", "timeout"] }
hyper = { version = "1.11.0", features = ["full", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["full"] }

# ── NAPI Bindings ──────────────────────────────────────────────────────────
napi = { version = "3.6.2", features = ["napi8"] }
napi-derive = "3.6.2"

# ── Error Handling ─────────────────────────────────────────────────────────
anyhow = "1.0.90"
thiserror = "2.0.12"

# ── Testing ────────────────────────────────────────────────────────────────
mockito = { version = "1.7.2" }
wiremock = { version = "0.6.0" }
tokio-test = "0.4.3"
tempfile = "3.14.0"

# ── Additional ─────────────────────────────────────────────────────────────
async-stream = "0.3.5"
async-trait = "0.1.76"
uuid = { version = "1.8.0", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4.39", features = ["serde", "clock"] }
mime = "0.3.17"
base64 = { version = "0.23.1", features = ["std"] }
percent-encoding = "2.3.1"
rand = { version = "0.8.5", features = ["std"] }
sha2 = "0.10.8"
urlencoding = "2.1.3"

[profile.dev]
opt-level = 1
panic = "abort"
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false

[profile.release.build-override]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.test]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.lints]
unsafe_code = { level = "deny" }

[workspace.lints.clippy]
nursery = { level = "deny" }
pedantic = { level = "deny" }
unwrap_used = { level = "deny" }
expect_used = { level = "deny" }
panic = { level = "deny" }
string_slice = { level = "deny" }
future_not_send = { level = "allow" }
large_futures = { level = "allow" }
volatile_composites = { level = "allow" }
multiple_crate_versions = { level = "allow" }