[workspace]
resolver = "2"
members = [
    "gmail-core",
    "gmail-cli",
    "gmail-skill-bindings",
]
exclude = ["target/**", ".cargo/**", "*.md"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Debanjan Basu <debanjanbasu2006@gmail.com>"]
repository = "https://github.com/debanjanbasu/gmail-opencode-rust"
description = "High-performance Gmail API client with HTTP/3, io_uring, and zero-copy streaming"
keywords = ["gmail", "api", "http3", "io-uring", "zero-copy", "napi"]
categories = ["api-bindings", "email", "network-programming"]

[workspace.dependencies]
# ── HTTP/3 + Compression Stack ─────────────────────────────────────────────
reqwest = { version = "0.13.4", features = [
    "http3",           # UNSTABLE: HTTP/3 support via quinn
    "zstd",            # zstd decompression
    "brotli",          # brotli decompression
    "rustls",          # rustls TLS backend
    "json", "form", "query"
] }

# ── Async Runtime ──────────────────────────────────────────────────────────
tokio = { version = "1.53.1", features = [
    "full", "rt-multi-thread", "macros", "signal", "io-std", "net", "time", "fs", "sync", "parking_lot"
] }
tokio-uring = { version = "0.5.0" }

# ── Serialization ──────────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

# ── Auth ───────────────────────────────────────────────────────────────────
url = "2.5.8"
ring = "0.17.14"
rustls = { version = "0.23.43", features = ["std", "logging", "aws-lc-rs"] }
webpki-roots = "0.26.11"

# ── Config & CLI ───────────────────────────────────────────────────────────
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help", "string"] }
dirs = "5.0.1"
toml = "0.8.23"
figment = { version = "0.10.19", features = ["env", "toml"] }

# ── Observability ──────────────────────────────────────────────────────────
tracing = { version = "0.1.44", features = ["std", "log", "attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# ── Performance ────────────────────────────────────────────────────────────
futures = "0.3.34"
bytes = "1.10"

# ── NAPI Bindings ──────────────────────────────────────────────────────────
napi = { version = "3.12.1", features = ["napi8"] }
napi-derive = "3.6.3"

# ── Error Handling ─────────────────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.20"

# ── Testing ────────────────────────────────────────────────────────────────
mockito = { version = "1.7.2" }
wiremock = { version = "0.6.5" }
tokio-test = "0.4.5"
tempfile = "3.27.0"

# ── Additional ─────────────────────────────────────────────────────────────
base64 = { version = "0.23.1", features = ["std"] }
rand = { version = "0.8.7", features = ["std"] }
sha2 = "0.10.9"
urlencoding = "2.1.3"

[profile.dev]
opt-level = 1
panic = "abort"
incremental = true
debug = 1
rustflags = ["--cfg", "reqwest_unstable"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
rustflags = ["--cfg", "reqwest_unstable"]

[profile.release.build-override]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = { level = "deny" }
expect_used = { level = "deny" }
panic = { level = "deny" }
string_slice = { level = "deny" }
future_not_send = { level = "allow" }
large_futures = { level = "allow" }
volatile_composites = { level = "allow" }
multiple_crate_versions = { level = "allow" }
